# Produced by `lextrace improve` (train data only). Thresholds were calibrated on train; do not edit by hand.
name: final
description: 'Selected by the train-only improvement loop; accepted changes: route_hard,
  dense_minilm, chunks_paragraph_800, gate_bm25_norm'
chunking:
  strategy: paragraph
  size: 800
  overlap: 0
  min_size: 40
routing:
  mode: hard
  top_docs: 1
  soft_weight: 0.5
  head_chars: 2000
  query_part: question
retrieval:
  method: dense
  candidates: 64
  bm25_k1: 1.5
  bm25_b: 0.75
  tfidf_ngram_max: 1
  tfidf_sublinear_tf: true
  expansion: none
  tokenizer:
    lowercase: true
    stopwords: false
    stemming: none
  dense:
    model: sentence-transformers/all-MiniLM-L6-v2
    query_prefix: ''
    batch_size: 32
  hybrid:
    components:
    - bm25
    - dense
    fusion: rrf
    weights:
    - 0.5
    - 0.5
    rrf_k: 60
rerank:
  enabled: false
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 32
  weight: 1.0
postprocess:
  dedupe_overlaps: true
  expand_chars: 0
abstention:
  enabled: true
  gates:
  - signal: bm25_norm
    threshold: 0.3298243841432863
  max_false_abstention: 0.1
evaluation:
  ks:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  primary_k: 4
