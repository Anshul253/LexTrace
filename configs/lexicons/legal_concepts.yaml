# Concept lexicon for optional query expansion (retrieval.expansion: lexicon).
# Written from general contract vocabulary for the 41 public CUAD clause categories (Hendrycks et al., 2021),
# BEFORE any experiment was run, and never edited from benchmark answers or test results.
# A trigger phrase found in the question (case-insensitive substring) appends its `expand` terms.
concepts:
  - triggers: ["expiration date", "expire", "term of this"]
    expand: [term, shall continue, years, until, terminate, expiration]
  - triggers: ["renewal term", "renew"]
    expand: [renew, renewal, automatically, successive, extend]
  - triggers: ["notice period to terminate renewal", "terminate renewal"]
    expand: [notice, prior, days, non-renewal, renew]
  - triggers: ["effective date"]
    expand: [effective, commence, dated]
  - triggers: ["agreement date", "date of the contract"]
    expand: [dated, day, entered]
  - triggers: ["governing law"]
    expand: [governed, laws, construed, state, jurisdiction]
  - triggers: ["most favored nation", "most favoured nation"]
    expand: [favorable, terms, pricing, no less]
  - triggers: ["non-compete", "compete", "competitive restriction"]
    expand: [compete, competing, competitive, engage, business]
  - triggers: ["exclusivity", "exclusive"]
    expand: [exclusive, exclusively, sole]
  - triggers: ["no-solicit", "non-solicit", "solicit"]
    expand: [solicit, hire, employ, induce]
  - triggers: ["non-disparagement", "disparage"]
    expand: [disparage, disparaging, derogatory]
  - triggers: ["termination for convenience", "terminate for convenience", "convenience"]
    expand: [terminate, without cause, notice, days, any reason]
  - triggers: ["rofr", "rofo", "rofn", "right of first"]
    expand: [first refusal, first offer, first negotiation, right]
  - triggers: ["change of control"]
    expand: [control, merger, acquisition, acquire, sale]
  - triggers: ["anti-assignment", "assign"]
    expand: [assign, assignment, transfer, consent, successors]
  - triggers: ["revenue/profit sharing", "revenue sharing", "profit sharing", "profit-sharing", "revenue or profit"]
    expand: [royalty, royalties, percent, share, fees, revenue, profits]
  - triggers: ["price restriction", "price restrictions"]
    expand: [price, increase, adjust, pricing]
  - triggers: ["minimum commitment", "minimum"]
    expand: [minimum, purchase, quantity, at least]
  - triggers: ["volume restriction"]
    expand: [quantity, volume, maximum, exceed, units]
  - triggers: ["ip ownership", "intellectual property", "owns the ip"]
    expand: [own, ownership, title, rights, intellectual property, inventions]
  - triggers: ["joint ip", "jointly own"]
    expand: [jointly, joint, owned, co-owned]
  - triggers: ["license grant", "licenses granted", "license"]
    expand: [license, grant, grants, right to use]
  - triggers: ["non-transferable"]
    expand: [non-transferable, transfer, assign]
  - triggers: ["affiliate license", "affiliates"]
    expand: [affiliates, subsidiaries]
  - triggers: ["unlimited", "all-you-can-eat"]
    expand: [unlimited, any number]
  - triggers: ["irrevocable", "perpetual"]
    expand: [irrevocable, perpetual, royalty-free]
  - triggers: ["source code escrow", "escrow"]
    expand: [escrow, source code, deposit]
  - triggers: ["post-termination services", "after termination"]
    expand: [termination, expiration, following, thereafter, survive]
  - triggers: ["audit rights", "audit"]
    expand: [audit, inspect, books, records, examine]
  - triggers: ["uncapped liability", "cap on liability", "liability"]
    expand: [liable, liability, damages, exceed, consequential, aggregate]
  - triggers: ["liquidated damages"]
    expand: [liquidated, damages, penalty]
  - triggers: ["warranty duration", "warranty"]
    expand: [warrant, warranty, warranties, months, defects]
  - triggers: ["insurance"]
    expand: [insurance, insured, coverage, policy]
  - triggers: ["covenant not to sue", "not to sue"]
    expand: [sue, challenge, contest, claim]
  - triggers: ["third party beneficiary", "third-party beneficiary"]
    expand: [third party, beneficiary, beneficiaries]
  - triggers: ["parties"]
    expand: [between, party, parties]
