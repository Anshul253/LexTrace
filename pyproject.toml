[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clauselens"
version = "1.0.0"
description = "ClauseLens: clause-evidence retrieval over contracts (LegalBench-RAG CUAD-mini) with measured retrieval and abstention"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
    "typer>=0.12",
    "huggingface_hub>=0.24,<1.0",
    "streamlit>=1.35",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clauselens = "clauselens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the downloaded dataset (and, for dense tests, the embedding model)",
]
addopts = "-m 'not integration'"
